<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | VPN Traffic Analysis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); padding: 1rem; }
    .auth-card { width: 100%; max-width: 400px; background: var(--card); border-radius: var(--radius); padding: 2rem; box-shadow: var(--shadow); border: 1px solid var(--border); }
    .auth-card h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    .auth-card p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
    .auth-tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
    .auth-tab { flex: 1; padding: 0.6rem; border: 1px solid var(--border); background: var(--bg); border-radius: var(--radius); cursor: pointer; font-weight: 500; text-align: center; }
    .auth-tab.active { background: var(--primary); color: white; border-color: var(--primary); }
    .auth-form { display: none; }
    .auth-form.active { display: block; }
    .auth-form .form-group { margin-bottom: 1rem; }
    .auth-form label { display: block; font-size: 0.9rem; margin-bottom: 0.35rem; }
    .auth-form input { width: 100%; padding: 0.6rem 0.75rem; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); font-size: 1rem; }
    .auth-form input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-light); }
    .auth-form .btn { width: 100%; padding: 0.75rem; margin-top: 0.5rem; }
    .auth-msg { font-size: 0.85rem; color: var(--error); margin-top: 0.5rem; }
    .auth-msg.success { color: var(--success); }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="logo" style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem;">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
        </svg>
        <span style="font-size: 1.25rem; font-weight: 600;">VPN Traffic Analysis</span>
      </div>
      <h1>Welcome</h1>
      <p>Sign in or create an account to access the dashboard.</p>

      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Login</button>
        <button class="auth-tab" data-tab="register">Register</button>
      </div>

      <form id="loginForm" class="auth-form active">
        <div class="form-group">
          <label>Username</label>
          <input type="text" name="username" required placeholder="Enter username">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" required placeholder="Enter password">
        </div>
        <button type="submit" class="btn btn-primary">Sign In</button>
        <p id="loginMsg" class="auth-msg"></p>
      </form>

      <form id="registerForm" class="auth-form">
        <div class="form-group">
          <label>Username</label>
          <input type="text" name="username" required placeholder="Choose username">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" required placeholder="Choose password" minlength="4">
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" name="confirm" required placeholder="Confirm password">
        </div>
        <button type="submit" class="btn btn-primary">Create Account</button>
        <p id="registerMsg" class="auth-msg"></p>
      </form>
    </div>
  </div>
  <script>
    (function() {
      if (localStorage.getItem('vpn_user')) {
        window.location.href = '/';
        return;
      }
      const USERS_KEY = 'vpn_users';
      const USER_KEY = 'vpn_user';

      function getUsers() {
        try { return JSON.parse(localStorage.getItem(USERS_KEY) || '{}'); } catch { return {}; }
      }
      function saveUsers(users) { localStorage.setItem(USERS_KEY, JSON.stringify(users)); }

      document.querySelectorAll('.auth-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
          document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
          tab.classList.add('active');
          document.getElementById(tab.dataset.tab + 'Form').classList.add('active');
          document.getElementById(tab.dataset.tab + 'Msg').textContent = '';
        });
      });

      document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const msg = document.getElementById('loginMsg');
        const username = e.target.username.value.trim();
        const password = e.target.password.value;
        const users = getUsers();
        if (!users[username] || users[username] !== password) {
          msg.textContent = 'Invalid username or password';
          msg.classList.remove('success');
          return;
        }
        localStorage.setItem(USER_KEY, JSON.stringify({ username }));
        msg.textContent = 'Success! Redirecting...';
        msg.classList.add('success');
        setTimeout(() => window.location.href = '/', 500);
      });

      document.getElementById('registerForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const msg = document.getElementById('registerMsg');
        const username = e.target.username.value.trim();
        const password = e.target.password.value;
        const confirm = e.target.confirm.value;
        if (password !== confirm) {
          msg.textContent = 'Passwords do not match';
          msg.classList.remove('success');
          return;
        }
        if (password.length < 4) {
          msg.textContent = 'Password must be at least 4 characters';
          msg.classList.remove('success');
          return;
        }
        const users = getUsers();
        if (users[username]) {
          msg.textContent = 'Username already exists';
          msg.classList.remove('success');
          return;
        }
        users[username] = password;
        saveUsers(users);
        localStorage.setItem(USER_KEY, JSON.stringify({ username }));
        msg.textContent = 'Account created! Redirecting...';
        msg.classList.add('success');
        setTimeout(() => window.location.href = '/', 500);
      });
    })();
  </script>
</body>
</html>
